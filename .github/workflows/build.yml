name: Build Aseprite Preview Extension

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.10.0
                  run_install: false

            - name: Install dependencies
              run: pnpm install

            - name: Build extension
              run: pnpm compile

            - name: Package extension
              run: |
                  npx @vscode/vsce package
                  ls -la *.vsix

            - name: Upload extension artifact
              uses: actions/upload-artifact@v4
              with:
                  name: aseprite-preview-extension
                  path: "*.vsix"
                  retention-days: 30
